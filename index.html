<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Name – Web, games & hardware</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<header>
  <a href="#" class="logo" aria-label="Home">
    <svg viewBox="0 0 42 42" aria-hidden="true"><rect width="42" height="42" rx="13" fill="#ffe14d"/><rect class="eye" x="11" y="14" width="6" height="9" rx="3" fill="#10124a"/><rect class="eye" x="25" y="14" width="6" height="9" rx="3" fill="#10124a"/><path d="M12 28 Q21 36 30 28" stroke="#10124a" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>
    <span>yourname</span>
  </a>
  <nav aria-label="Main">
    <a href="#work">Work</a>
    <a href="#about">About</a>
    <a href="#contact" class="cta">Say hello</a>
  </nav>
</header>

<main class="hero">
  <div>
    <h1 id="name" aria-label="Your Name"></h1>
    <p class="desc">I build websites, games and hardware. Sometimes all three in the same weekend.</p>
  </div>
  <div class="stage">
    <div class="device" id="device">
      <div class="bezel">
        <div class="led"><i></i>power</div>
        <div class="screen" id="screen">
          <!-- Replace the svg and small with: <img src="your-photo.jpg" alt="Your Name"> -->
          <em id="tag">web</em>
          <svg viewBox="0 0 200 160" aria-hidden="true"><circle cx="100" cy="52" r="34" fill="#10124a"/><path d="M20 160 C20 100 60 92 100 92 C140 92 180 100 180 160Z" fill="#10124a"/></svg>
          <small>Your photo goes here</small>
        </div>
      </div>
      <div class="controls">
        <div class="dpad" aria-hidden="true"></div>
        <div class="btns"><button type="button" id="a" aria-label="Next project type">A</button><button type="button" id="b" aria-label="Previous project type">B</button></div>
      </div>
    </div>
    <p class="hint">Press A or B</p>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
